<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | VetClinic</title>
    <link rel="stylesheet" href="styles.css" />

</head>
<body>
    
    <!--Navbar-->
    <nav class="navbar">
        <div class="logo">VetClinic</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="booking.html">Book Appointment</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!--booking form section-->
    <section class="booking container">
        <h2>Book an Appointment</h2>
        <form class="booking-form">

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="mail" id="mail" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="number" id="phone" required>
            </div>
            
            <div class="form-group">
                <label for="Pet">Pet Type *</label>
                <input type="text" id="pet" placeholder="e.g. Dog, Cat" required>
            </div>

            <div class="form-group">
                <label for="service">Select Service *</label>
                <select id="service" required>
                        <option value="">-- Choose a Service --</option>
                        <option value="consulation">Consulation</option>
                        <option value="vaccination">Vaccination</option>
                        <option value="surgery">Surgery</option>
                        <option value="Emergency">Emergency</option>
                        <option value="Checkup">General Check-up</option>
                        <option value="Book DOC">Book Day Old chciks</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Preferred Date & Time *</label>
                <input type="datetime-local" id="date" required>
            </div>

            <div class="form-group">
                <label for="message">Additional Message (optional) *</label>
                <textarea id="message" rows="4"></textarea>
            </div>

            <button type="submit" class="btn">Submit Booking</button>
        </form>
    </section>

        <!--Footer-->
        <footer>

                <p> Email: info@animalworld.com | Phone: +234-802-718-6490</p>
                <p><i>Built by: BossTech.Co</i></p>
            </div>
         </footer>
</body>
</html>
